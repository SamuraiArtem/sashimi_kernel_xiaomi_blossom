name: Build sashimi kernel

on:
  push:
    branches: [sashimi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            python3 cpio gzip

      - name: Configure
        run: |
          make O=out ARCH=arm64 blossom_defconfig
          scripts/config --file out/.config \
            -e FTRACE -e DYNAMIC_DEBUG -e KPROBES \
            -e FUNCTION_TRACER -e ENABLE_DEFAULT_TRACERS
          make O=out ARCH=arm64 olddefconfig

      - name: Build
        run: |
          make -j$(nproc) \
            O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz
